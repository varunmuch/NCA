model:
  provider: vllm
  name: cie-vl
  base_url: http://127.0.0.1:8000
  endpoint: /v1/chat/completions

  temperature: 0.0
  max_tokens: 1400

  timeout_seconds: 180

  context_window: 16384

database:
  # Connection URL (with credentials) comes from CIE_DATABASE_URL in backend/.env
  url_env: CIE_DATABASE_URL
